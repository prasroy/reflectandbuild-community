name: "💡 FocusLock idea"
description: Suggest an improvement or a nice-to-have feature for FocusLock.
title: "Idea: "
labels: ["idea", "app:focuslock", "status:under-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape FocusLock! Ideas are public: others can vote with 👍, and the status shows on the [ideas board](https://quietkite.pages.dev/apps/focuslock/ideas/).
        Please [search existing ideas](https://github.com/prasroy/quietkite-community/issues?q=is%3Aissue+label%3Aidea) first, and add a 👍 to one that matches yours.
  - type: textarea
    id: idea
    attributes:
      label: What would you like FocusLock to do?
      description: Describe the idea in a few sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help you?
      description: For example, what you're studying and where you get stuck today.
  - type: dropdown
    id: importance
    attributes:
      label: How important is it to you?
      options:
        - Nice to have
        - Important
        - Essential
    validations:
      required: true
